<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <div id="app" class="fp-app">
    <div class="fp-stage">
      <svg id="plan" class="fp-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="house3d" hidden></div>
      <div id="levels" class="fp-levels" hidden></div>
      <div class="fp-corner">
        <button id="btn-full" class="fp-round" type="button" aria-label="Open full screen" hidden>⤢</button>
        <button id="btn-view" class="fp-round" type="button" aria-label="2D / 2.5D">2D</button>
        <button id="btn-turn" class="fp-round" type="button" aria-label="Turn">⟲</button>
      </div>
      <div id="empty" class="fp-empty" hidden></div>
    </div>
    <aside id="side" class="fp-side" hidden>
      <div class="fp-clock"><div id="clock-time" class="fp-time"></div><div id="clock-date" class="fp-date"></div></div>
      <div id="weather" class="fp-weather"></div>
      <div id="agenda" class="fp-agenda"></div>
    </aside>
    <div id="sheet" class="fp-sheet" hidden>
      <div class="fp-sheet-card" role="dialog">
        <div class="fp-sheet-head"><div id="sheet-title" class="fp-sheet-title"></div><button id="sheet-close" class="fp-x" type="button" aria-label="Close">✕</button></div>
        <div id="sheet-body" class="fp-sheet-body"></div>
      </div>
    </div>
  </div>
  <script src="models.js"></script>
  <script src="floorplan-core.js"></script>
  <script src="house-core.js"></script>
  <script src="widget.js"></script>
</body>
</html>
