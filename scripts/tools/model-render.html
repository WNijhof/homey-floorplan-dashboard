<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Development tool for scripts/render-models.js: renders a model to a PNG (catalogue tile or top view). -->
  <script type="importmap">{ "imports": { "three": "/vendor/three/three.module.min.js", "three/addons/": "/vendor/three/addons/" } }</script>
</head>
<body style="margin:0;background:transparent">
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const loader = new GLTFLoader();
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);

// mode: 'iso' (catalogue tile, 3/4 view from the front) or 'top' (orthographic, exactly the footprint).
// yaw: degrees that turn the model so its front faces +Z. size: [w, d, h] in cm to fit.
window.renderModel = async function (url, mode, yaw, size, px) {
  const gltf = await loader.loadAsync(url);
  const model = gltf.scene;
  const scene = new THREE.Scene();
  const holder = new THREE.Group();
  holder.add(model);
  model.rotation.y = THREE.MathUtils.degToRad(yaw || 0);
  holder.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(holder);
  const s = box.getSize(new THREE.Vector3());
  const [w, d, h] = size.map((v) => v / 100);
  holder.scale.set(w / s.x, h / s.y, d / s.z);
  holder.updateMatrixWorld(true);
  const b2 = new THREE.Box3().setFromObject(holder);
  holder.position.set(-(b2.min.x + b2.max.x) / 2, -b2.min.y, -(b2.min.z + b2.max.z) / 2);
  scene.add(holder);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8070, 2.2));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(2, 5, 3);
  scene.add(sun);

  let camera; let W; let H;
  if (mode === 'top') {
    const k = px / Math.max(w, d);
    W = Math.max(8, Math.round(w * k)); H = Math.max(8, Math.round(d * k));
    camera = new THREE.OrthographicCamera(-w / 2, w / 2, d / 2, -d / 2, 0.01, 20);
    camera.position.set(0, 10, 0);
    camera.up.set(0, 0, -1);
    camera.lookAt(0, 0, 0);
  } else {
    W = px; H = Math.round(px * 0.75);
    const r = Math.max(w, d, h) * 0.62;
    const aspect = W / H;
    camera = new THREE.OrthographicCamera(-r * aspect, r * aspect, r, -r, 0.01, 50);
    camera.position.set(r * 1.6, r * 1.3, r * 2.2);
    camera.lookAt(0, h * 0.4, 0);
  }
  renderer.setSize(W, H, false);
  renderer.setClearColor(0x000000, 0);
  renderer.render(scene, camera);
  const data = renderer.domElement.toDataURL('image/png');
  scene.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
  return data;
};
window.ready = true;
</script>
</body>
</html>
